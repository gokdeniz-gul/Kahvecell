name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend testleri (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kahvecell_test
          POSTGRES_USER: kahvecell
          POSTGRES_PASSWORD: kahvecell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kahvecell"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://kahvecell:kahvecell@localhost:5432/kahvecell_test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q -p no:warnings
      - name: Migration + seed (PostgreSQL)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://kahvecell:kahvecell@localhost:5432/kahvecell_test
        run: python -m scripts.seed && python -m scripts.seed

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose + uçtan uca duman testi
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Sistemi ayağa kaldır
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Uçtan uca senaryo (nginx → FastAPI → PostgreSQL, SSE dahil)
        run: python3 backend/scripts/smoke_test.py http://localhost:8080
      - name: Frontend sayfası ve SPA yönlendirmesi
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>KahveCell</title>"
          curl -fsS http://localhost:8080/siparis/herhangi-bir-id | grep -q "<title>KahveCell</title>"
          curl -fsS http://localhost:8080/docs | grep -qi swagger
      - name: Loglar (hata olursa)
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
