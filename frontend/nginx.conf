server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Güvenlik başlıkları (statik dosyalar için; API kendi başlıklarını ekliyor)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API isteklerini backend'e yönlendir (aynı adres → CORS gerekmez)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (canlı sipariş takibi): tamponlama kapalı, bağlantı uzun süre açık kalabilir
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Swagger dokümantasyonu
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # İsimli dosyalar (hash'li) uzun süre önbellekte kalabilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: bilinmeyen adresler index.html'e düşsün (örn. /siparis/123 yenilenince)
    location / {
        try_files $uri /index.html;
    }
}
